---
- name: Install transfer watcher systemd unit
  ansible.builtin.template:
    src: ../templates/transfer-watch.service.j2
    dest: "{{ datadiode_systemd_user_root }}/datadiode-transfer-watch.service"
    owner: "{{ datadiode_runtime_user }}"
    group: "{{ datadiode_runtime_group }}"
    mode: "0644"

- name: Enable and start transfer watcher
  ansible.builtin.systemd_service:
    name: datadiode-transfer-watch.service
    daemon_reload: true
    enabled: true
    state: started
    scope: user
  environment: "{{ datadiode_systemd_user_env }}"
