---
- name: Install Zot systemd unit
  ansible.builtin.template:
    src: ../templates/zot.service.j2
    dest: "{{ datadiode_systemd_user_root }}/datadiode-zot.service"
    owner: "{{ datadiode_runtime_user }}"
    group: "{{ datadiode_runtime_group }}"
    mode: "0644"

- name: Enable and start Zot
  ansible.builtin.systemd_service:
    name: datadiode-zot.service
    daemon_reload: true
    enabled: true
    state: started
    scope: user
  environment: "{{ datadiode_systemd_user_env }}"
