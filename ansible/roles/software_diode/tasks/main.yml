---
- name: Install required packages
  ansible.builtin.package:
    name:
      - iproute
      - nftables
    state: present

- name: Deploy diode setup script
  ansible.builtin.template:
    src: osdd-diode-setup.sh.j2
    dest: "{{ software_diode_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Deploy systemd unit for diode setup
  ansible.builtin.template:
    src: osdd-diode-setup.service.j2
    dest: "/etc/systemd/system/{{ software_diode_unit_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Ensure diode setup service is enabled and started
  ansible.builtin.systemd:
    name: "{{ software_diode_unit_name }}"
    enabled: true
    state: started

- name: Run diode setup script immediately
  ansible.builtin.command: "{{ software_diode_script_path }}"
  changed_when: false

- name: Verify nftables ruleset contains diode table
  ansible.builtin.command: nft list table inet {{ software_diode_nft_table }}
  register: diode_nft_check
  changed_when: false
