workdir = "/trunk"
transfer_root = "/trunk/transfer"
config_root = "/config"
directory_mode = "2775"

[transfer]
watched_areas = ["repository", "registry", "maven"]

[services.zot]
enabled = true
binary = "/usr/bin/zot"
listen_host = "0.0.0.0"
listen_port = 5001
data_dir = "/trunk/registry/data"
runtime_config = "/trunk/registry/zot-config.generated.json"
log_level = "info"

[services.reposilite]
enabled = false
binary = "/usr/bin/java"
args = []

[sync.repositories]
enabled = true
schedule = "15 02 * * *"
full_sync = "weekly"
baseurl = "https://repo.k.mis.local"
gpg_key_files = ["/config/RPM-GPG-KEY-test"]
iso_extractor = "/usr/bin/tar"
iso_extractor_args = ["-xf"]
iso_dir = "/trunk/iso"

[sync.registries]
enabled = true
schedule = "45 02 * * *"
full_sync = "daily"
namespace = "internet"
