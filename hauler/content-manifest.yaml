---
apiVersion: content.hauler.cattle.io/v1
kind: Charts
metadata:
  name: hauler-charts
spec:
  charts:
  - name: hauler-helm
    repoURL: oci://ghcr.io/hauler-dev
    add-images: true
  - name: zot
    repoURL: http://zotregistry.dev/helm-charts
    add-images: true
  - name: gitlab-runner
    repoURL: https://charts.gitlab.io
    version: 0.71.0
    add-images: true
  - name: gitlab-agent
    repoURL: https://charts.gitlab.io
    version: 2.9.1
    add-images: true
  - name: spegel
    repoURL: oci://ghcr.io/spegel-org/helm-charts
    version: 0.3.0
    add-images: true
  - name: cert-manager
    repoURL: https://charts.jetstack.io
    add-images: true
  - name: k8s-gateway
    repoURL: https://ori-edge.github.io/k8s_gateway
    add-images: true
---
apiVersion: content.hauler.cattle.io/v1
kind: Images
metadata:
  name: hauler-cluster-images
spec:
  images:
  - name: ghcr.io/project-zot/zot:v2.1.11
  - name: ghcr.io/spegel-org/spegel:v0.4.0
    certificate-identity-regexp: "https://github.com/spegel-org/spegel/.github/workflows/release.yaml@refs/tags/.*"
    certificate-oidc-issuer: https://token.actions.githubusercontent.com
    certificate-github-workflow-repository: spegel-org/spegel
